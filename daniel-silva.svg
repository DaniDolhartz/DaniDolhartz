<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="640" viewBox="0 0 1200 640" xml:space="preserve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131c"/>
      <stop offset="0.55" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bae6fd" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" r="0.5">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="640" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="640" fill="url(#bg)"/>
    <rect width="1200" height="640" fill="url(#glow1)"><animate attributeName="opacity" values="1;0.55;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect width="1200" height="640" fill="url(#glow2)"><animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/></rect>
    <rect width="1200" height="640" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- status pill -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="48" y="40" width="262" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="70" cy="57" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="62" font-size="13" fill="#cbd5e1">Disponible · aprendiendo y creando</text>
    <text x="1152" y="62" font-size="13" fill="#64748b" text-anchor="end">v2026.11 — Mendoza, AR</text>
  </g>

  <!-- left column -->
  <text x="48" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.5" fill="#38bdf8">// FULL STACK DEV · UTN FRSR</text>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-3">
    <text x="44" y="232" font-size="88" fill="#f8fafc">Daniel</text>
    <text x="44" y="320" font-size="88" fill="url(#name)">Silva.</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">
    <text x="48" y="372">Desarrollo aplicaciones web de punta a punta,</text>
    <text x="48" y="400">del modelo de datos a la interfaz.</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <rect x="48" y="424" width="150" height="36" rx="8" fill="#f8fafc"/>
    <text x="123" y="447" text-anchor="middle" fill="#0f172a" font-weight="600">Web · Backend</text>
    <rect x="210" y="424" width="200" height="36" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="310" y="447" text-anchor="middle" fill="#e2e8f0">open to collaborate</text>
  </g>

  <!-- right: code window -->
  <g transform="translate(660,110)">
    <rect width="492" height="330" rx="14" fill="#0b1220" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.35"/>
    <path id="frame" d="M14 0 H478 A14 14 0 0 1 492 14 V316 A14 14 0 0 1 478 330 H14 A14 14 0 0 1 0 316 V14 A14 14 0 0 1 14 0 Z" fill="none"/>
    <circle r="26" fill="url(#spark)">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#frame" xlink:href="#frame"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#f0f9ff">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#frame" xlink:href="#frame"/></animateMotion>
    </circle>
    <path d="M14 0 H478 A14 14 0 0 1 492 14 V44 H0 V14 A14 14 0 0 1 14 0 Z" fill="#ffffff" fill-opacity="0.03"/>
    <line x1="0" y1="44" x2="492" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444" fill-opacity="0.7"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b" fill-opacity="0.7"/>
    <circle cx="58" cy="22" r="5" fill="#22c55e" fill-opacity="0.7"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="84" y="27" font-size="12" fill="#64748b">~/danielsilva / about.ts</text>
      <rect x="400" y="12" width="76" height="20" rx="10" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="438" y="26" font-size="10" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">TS</text>

      <g font-size="15">
        <text x="24" y="84" fill="#475569">1</text>
        <text x="52" y="84"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> daniel </tspan><tspan fill="#94a3b8">= {</tspan></text>
        <text x="24" y="112" fill="#475569">2</text>
        <text x="52" y="112"><tspan fill="#7dd3fc">  rol</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">"Full Stack Dev"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="24" y="140" fill="#475569">3</text>
        <text x="52" y="140"><tspan fill="#7dd3fc">  estudia</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">"UTN FRSR"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="24" y="168" fill="#475569">4</text>
        <text x="52" y="168"><tspan fill="#7dd3fc">  base</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">"Mendoza, AR"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="24" y="196" fill="#475569">5</text>
        <text x="52" y="196"><tspan fill="#7dd3fc">  foco</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#fbbf24">"APIs"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fbbf24">"DBs"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#fbbf24">"UI"</tspan><tspan fill="#94a3b8">],</tspan></text>
        <text x="24" y="224" fill="#475569">6</text>
        <text x="52" y="224"><tspan fill="#7dd3fc">  cafe</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fb923c">Infinity</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="24" y="252" fill="#475569">7</text>
        <text x="52" y="252"><tspan fill="#94a3b8">};</tspan></text>
        <text x="24" y="292" fill="#475569">8</text>
        <text x="52" y="292"><tspan fill="#64748b">// </tspan><tspan fill="#64748b">siempre hay un commit más</tspan></text>
        <rect x="312" y="279" width="9" height="17" fill="#38bdf8">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- stack -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <text x="48" y="506" fill="#64748b" letter-spacing="2.5">STACK</text>
    <line x1="112" y1="502" x2="1152" y2="502" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">
    <g transform="translate(48,524)"><rect width="110" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#3b82f6"/><text x="30" y="22">Python</text></g>
    <g transform="translate(168,524)"><rect width="88" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#f97316"/><text x="30" y="22">Java</text></g>
    <g transform="translate(266,524)"><rect width="134" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#60a5fa"/><text x="30" y="22">TypeScript</text></g>
    <g transform="translate(410,524)"><rect width="110" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#22c55e"/><text x="30" y="22">Node.js</text></g>
    <g transform="translate(530,524)"><rect width="88" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#38bdf8"/><text x="30" y="22">React</text></g>
    <g transform="translate(628,524)"><rect width="132" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#818cf8"/><text x="30" y="22">PostgreSQL</text></g>
    <g transform="translate(770,524)"><rect width="88" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#14b8a6"/><text x="30" y="22">MySQL</text></g>
    <g transform="translate(868,524)"><rect width="98" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#0ea5e9"/><text x="30" y="22">Docker</text></g>
    <g transform="translate(976,524)"><rect width="88" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#eab308"/><text x="30" y="22">Linux</text></g>
    <g transform="translate(1074,524)"><rect width="78" height="34" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="18" cy="17" r="4" fill="#ef4444"/><text x="30" y="22">Git</text></g>
  </g>

  <!-- footer -->
  <line x1="0" y1="584" x2="1200" y2="584" stroke="#ffffff" stroke-opacity="0.07"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <text x="48" y="617"><tspan fill="#22c55e">$ </tspan><tspan fill="#64748b">git commit -m </tspan><tspan fill="#f8fafc">"idea → código → deploy"</tspan></text>
    <rect x="370" y="604" width="8" height="16" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="1152" y="617" fill="#64748b" text-anchor="end">github.com/danielsilva</text>
  </g>

  <!-- light sweep -->
  <g clip-path="url(#card)" pointer-events="none">
    <rect x="-420" y="-200" width="320" height="1040" fill="url(#shine)" transform="rotate(18 600 320)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;1900 0;1900 0" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
